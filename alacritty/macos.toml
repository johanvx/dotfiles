[window]
decorations = "Buttonless"
option_as_alt = "OnlyLeft"

# Option+Enter https://pi.dev/docs/latest/terminal-setup#alacritty
[[keyboard.bindings]]
key = "Enter"
mods = "Alt"
chars = "\u001b[13;3u"

[[hints.enabled]]
command = "open"
hyperlinks = true
persist = false
post_processing = true
mouse = { mods = "Control|Alt", enabled = true }
binding = { key = "`", mods = "Control|Alt" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
