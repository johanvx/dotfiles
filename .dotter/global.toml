[settings]
default_target_type = "symbolic"

[agentic.files]
"agentic/.agents" = "~/.agents"
"agentic/.pi" = "~/.pi"

[alacritty.files]
alacritty = "~/.config/alacritty"

[bash.files]
bash = "~/.config/bash"

[eza.files]
eza = "~/.config/eza"

[fish.files]
fish = "~/.config/fish"

[ghostty.files]
ghostty = "~/.config/ghostty"

[nvim.files]
nvim = "~/.config/nvim"

[rio.files]
rio = "~/.config/rio"

[tmux-remote.files]
"tmux/remote.tmux.conf" = "~/.tmux.conf"

[tmux-local.files]
"tmux/local.tmux.conf" = "~/.tmux.conf"

[vim.files]
"vim/.vimrc" = "~/.vimrc"
"vim/.vim/colors" = "~/.vim/colors"

[zellij.files]
zellij = "~/.config/zellij"
